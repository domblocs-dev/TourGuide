name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restaurer les paquets
        run: dotnet restore

      - name: Compiler
        run: dotnet build --no-restore --configuration Release

      - name: Tests rapides
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~PerformanceTest"

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restaurer les paquets
        run: dotnet restore

      - name: Compiler
        run: dotnet build --no-restore --configuration Release

      - name: Tests de performance
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~PerformanceTest" --logger "console;verbosity=detailed"

  artefact:
    runs-on: ubuntu-latest
    needs: [ tests, performance ]

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Publier l'API
        run: dotnet publish Api/TourGuide.csproj --configuration Release --output publication

      - name: Archiver les DLL
        uses: actions/upload-artifact@v4
        with:
          name: tourguide-api
          path: publication